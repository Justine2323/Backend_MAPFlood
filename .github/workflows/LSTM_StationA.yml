name: Continuous LSTM for Station A Predictive

on:
  schedule:
    # Runs every 5 minutes automatically
    - cron: '*/5 * * * *'
  workflow_dispatch: # Allows you to trigger it manually from the GitHub UI

jobs:
  run-prediction:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy pandas supabase scikit-learn tensorflow
          
      - name: Run LSTM Script
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python station_a/StationA.py
