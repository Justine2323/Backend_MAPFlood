name: Hourly Flood LSTM Pipeline

on:
  schedule:
    - cron: '0 * * * *'  # Runs automatically at the start of every hour
  workflow_dispatch:      # Gives you a manual "Run workflow" button in GitHub

jobs:
  run-lstm:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
  run: |
    python -m pip install --upgrade pip
    pip install tensorflow-cpu supabase pandas numpy scikit-learn joblib matplotlib

      - name: Run Prediction & Training Pipeline
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python lstm_tanong_malabon_realtime.py
